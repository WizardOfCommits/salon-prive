<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Le Salon Privé · Roulette</title>
<style>
:root{
  --gold:#d9b45b; --gold2:#f0d78c; --felt:#0b4a30; --red:#a3242e;
  --ink:#0a0605; --ivory:#ede3cb; --serif:'Bodoni 72','Didot','Playfair Display',Georgia,serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:#070403;color:var(--ivory);
  font-family:-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;}
button{font-family:inherit;cursor:pointer;}
#app{position:fixed;inset:0;z-index:1;}
#app canvas{display:block;}

#vignette{position:fixed;inset:0;z-index:6;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%, transparent 38%, rgba(0,0,0,.55) 78%, rgba(0,0,0,.85) 100%);}
#grain{position:fixed;inset:-40px;z-index:7;pointer-events:none;opacity:.055;}

/* ---------- top bar ---------- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:10;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;
  background:linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,0));}
#bankWrap{display:flex;align-items:center;gap:8px;}
#bankVal{font-family:var(--serif);font-size:19px;color:var(--gold2);letter-spacing:.03em;font-variant-numeric:tabular-nums;}
#caisseBtn{display:none;border:1px solid rgba(217,180,91,.6);background:rgba(217,180,91,.08);
  color:var(--gold2);font-size:10px;letter-spacing:.12em;padding:5px 9px;border-radius:20px;}
#caisseBtn.show{display:block;animation:pulse 1.4s ease-in-out infinite;}
#phaseLbl{font-family:var(--serif);font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(217,180,91,.85);text-align:center;white-space:nowrap;}
#phaseLbl.urgent{color:var(--gold2);animation:pulse 1s ease-in-out infinite;}
#toggles{display:flex;justify-content:flex-end;gap:8px;}
.icoBtn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(217,180,91,.35);
  background:rgba(0,0,0,.35);color:var(--gold);font-size:15px;display:flex;align-items:center;justify-content:center;}
.icoBtn.off{opacity:.35;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

#history{position:fixed;top:calc(env(safe-area-inset-top,0px) + 52px);left:0;right:0;z-index:9;
  display:flex;justify-content:center;gap:5px;pointer-events:none;}
.hdot{width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:700;color:#f2e9d4;border:1px solid rgba(255,255,255,.22);
  box-shadow:0 2px 5px rgba(0,0,0,.7);}
.hdot:first-child{transform:scale(1.2);border-color:var(--gold);}
.bg-red{background:linear-gradient(#b02a34,#7e1c25);}
.bg-black{background:linear-gradient(#242422,#101010);}
.bg-green{background:linear-gradient(#0d7a4c,#08533a);}

/* ---------- feed ---------- */
#feed{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 138px);z-index:8;
  width:min(76vw,340px);display:flex;flex-direction:column;gap:4px;pointer-events:none;}
.msg{background:rgba(0,0,0,.72);border-left:3px solid var(--gold);padding:6px 9px;border-radius:6px;
  font-size:12.5px;line-height:1.35;opacity:0;transform:translateX(-8px);
  animation:msgIn .25s ease forwards;transition:opacity .9s;}
.msg b{font-weight:700;}
.msg.fade{opacity:0!important;}
@keyframes msgIn{to{opacity:1;transform:none;}}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;bottom:0;z-index:12;
  padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 12px);
  display:flex;flex-direction:column;gap:11px;
  background:linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.82) 45%);
  transition:transform .35s ease, opacity .3s ease;}
#hud.hidden{transform:translateY(130%);opacity:0;pointer-events:none;}
.chipRow{display:flex;justify-content:center;gap:12px;}
.chip{width:46px;height:46px;border-radius:50%;border:none;position:relative;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;
  box-shadow:0 4px 9px rgba(0,0,0,.65), inset 0 2px 4px rgba(255,255,255,.25), inset 0 -3px 5px rgba(0,0,0,.45);
  transition:transform .15s ease, box-shadow .15s ease;}
.chip::after{content:'';position:absolute;inset:4px;border-radius:50%;border:2px dashed rgba(255,255,255,.7);}
.chip.sel{transform:translateY(-5px) scale(1.08);
  box-shadow:0 0 0 3px var(--gold), 0 6px 14px rgba(0,0,0,.7), inset 0 2px 4px rgba(255,255,255,.25);}
.c5{background:radial-gradient(circle at 35% 30%, #d4555c, #8e2129);}
.c25{background:radial-gradient(circle at 35% 30%, #3f9a68, #1d5c3c);}
.c100{background:radial-gradient(circle at 35% 30%, #4a4a52, #17171b);}
.c500{background:radial-gradient(circle at 35% 30%, #8f6fc9, #4c3379);}
.btnRow{display:flex;gap:10px;}
.hudGhost{flex:1;height:52px;border-radius:12px;background:rgba(217,180,91,.06);
  border:1px solid rgba(217,180,91,.55);color:var(--gold2);
  font-family:var(--serif);font-size:12.5px;letter-spacing:.18em;}
#btnLancer{flex:1.6;height:52px;border-radius:12px;border:none;
  background:linear-gradient(#f0d78c,#c69a3e);color:#221604;
  font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:.22em;
  box-shadow:0 4px 14px rgba(217,180,91,.35);}
#btnLancer:active,.hudGhost:active{transform:scale(.97);}

/* ---------- mise directe ---------- */
#betTag{position:fixed;top:calc(env(safe-area-inset-top,0px) + 86px);left:0;right:0;z-index:9;
  text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;}
#betTag.show{opacity:1;}
#btLine1{font-family:var(--serif);font-size:21px;letter-spacing:.2em;color:var(--gold2);
  text-shadow:0 2px 12px rgba(0,0,0,.85);}
#btLine2{font-size:10px;letter-spacing:.32em;color:rgba(237,227,203,.75);margin-top:4px;text-transform:uppercase;}
#miseLbl{text-align:center;font-family:var(--serif);font-size:13px;letter-spacing:.2em;
  color:rgba(240,215,140,.85);font-variant-numeric:tabular-nums;}
#zoomReset{display:none;position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 208px);
  z-index:11;padding:8px 13px;border-radius:18px;background:rgba(0,0,0,.55);
  border:1px solid rgba(217,180,91,.55);color:var(--gold2);
  font-size:10px;letter-spacing:.16em;font-family:var(--serif);}
#zoomReset.show{display:block;}

/* ---------- annonces ---------- */
#annRow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;}
#annRow::-webkit-scrollbar{display:none;}
.annBtn{flex:0 0 auto;height:34px;padding:0 15px;border-radius:17px;
  background:rgba(0,0,0,.4);border:1px solid rgba(217,180,91,.45);
  color:rgba(240,215,140,.92);font-size:10.5px;letter-spacing:.14em;font-family:var(--serif);}
.annBtn:active{background:rgba(217,180,91,.15);}

/* ---------- tendances ---------- */
#stats{position:fixed;left:0;right:0;bottom:0;z-index:26;height:74vh;height:74dvh;
  background:linear-gradient(#0c2318,#071710 55%,#051009);
  border-top:1px solid rgba(217,180,91,.5);border-radius:20px 20px 0 0;
  box-shadow:0 -18px 50px rgba(0,0,0,.85);transform:translateY(106%);
  transition:transform .38s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;}
#stats.open{transform:translateY(0);}
#statsPat{position:absolute;inset:0;border-radius:20px 20px 0 0;opacity:.4;pointer-events:none;background-size:100px 176px;}
#statsHead{position:relative;display:flex;align-items:center;justify-content:space-between;
  padding:16px 16px 10px;}
#statsHead span{font-family:var(--serif);font-size:15px;letter-spacing:.28em;color:var(--gold2);}
#btnStatsClose{width:32px;height:32px;border-radius:50%;border:1px solid rgba(217,180,91,.4);
  background:rgba(0,0,0,.3);color:var(--gold);font-size:13px;}
#statsBody{position:relative;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 16px 24px;}
.sTitle{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:rgba(217,180,91,.6);
  margin:16px 0 8px;}
.sRow{display:flex;flex-wrap:wrap;gap:7px;align-items:flex-start;}
.sdot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#f2e9d4;border:1px solid rgba(255,255,255,.22);
  box-shadow:0 2px 5px rgba(0,0,0,.6);}
.sItem{display:flex;flex-direction:column;align-items:center;gap:3px;}
.sItem i{font-style:normal;font-size:9.5px;color:rgba(237,227,203,.6);letter-spacing:.05em;}
.bar{display:flex;height:20px;border-radius:10px;overflow:hidden;background:rgba(0,0,0,.45);
  border:1px solid rgba(217,180,91,.2);}
.bar span{display:block;}
.sg-red{background:linear-gradient(#b02a34,#8c1f28);}
.sg-black{background:linear-gradient(#26241f,#141312);}
.sg-green{background:linear-gradient(#12855a,#0a5c3a);}
.sg-g1{background:linear-gradient(#e6c877,#c69a3e);}
.sg-g2{background:linear-gradient(#a8842f,#8a6c2c);}
.sg-g3{background:linear-gradient(#6e5620,#55421a);}
.sLegend{font-size:10.5px;letter-spacing:.06em;color:rgba(237,227,203,.7);margin-top:5px;}
.sEmpty{margin-top:24px;text-align:center;font-family:var(--serif);font-size:14px;
  letter-spacing:.1em;color:rgba(237,227,203,.6);}
#btnStatsReset{background:none;border:none;color:rgba(217,180,91,.7);font-size:11px;
  letter-spacing:.08em;text-decoration:underline;padding:0;}

/* ---------- result ---------- */
#result{position:fixed;inset:0;z-index:22;display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .3s;}
#result.show{opacity:1;}
.rcard{background:rgba(11,7,5,.94);border:1px solid rgba(217,180,91,.4);border-radius:18px;
  padding:24px 38px;text-align:center;box-shadow:0 22px 60px rgba(0,0,0,.85);
  transform:scale(.9) translateY(10px);transition:transform .4s cubic-bezier(.2,1.4,.4,1);}
#result.show .rcard{transform:none;}
#resNum{width:88px;height:88px;border-radius:50%;margin:0 auto 12px;
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);
  font-size:42px;color:#f6edd7;border:2px solid rgba(217,180,91,.6);
  box-shadow:inset 0 3px 8px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.6);}
#resLine1{font-family:var(--serif);font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);}
#resLine2{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:#b3a78c;margin-top:4px;}
#resGain{margin-top:12px;font-family:var(--serif);font-size:27px;}
#resGain.win{color:var(--gold2);text-shadow:0 0 18px rgba(240,215,140,.5);}
#resGain.lose{color:#8f8271;font-size:16px;letter-spacing:.08em;}

#fx{position:fixed;inset:0;z-index:40;pointer-events:none;}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;text-align:center;padding:30px;
  background:radial-gradient(120% 100% at 50% 28%, #241409, #0a0503 62%, #030201);
  transition:opacity .8s ease;}
#gate.away{opacity:0;pointer-events:none;}
.gEyebrow{font-size:10px;letter-spacing:.5em;color:rgba(217,180,91,.6);text-transform:uppercase;}
.gTitle{font-family:var(--serif);font-size:clamp(34px,9vw,52px);letter-spacing:.14em;line-height:1.15;
  background:linear-gradient(#f4e3ae,#c69a3e 70%,#8a6420);-webkit-background-clip:text;background-clip:text;color:transparent;}
.gOrn{color:rgba(217,180,91,.6);font-size:14px;letter-spacing:1em;padding-left:1em;}
#gateStats{font-size:12px;letter-spacing:.16em;color:rgba(237,227,203,.65);font-variant-numeric:tabular-nums;}
#gateEnter{margin-top:10px;background:transparent;border:1px solid var(--gold);color:var(--gold2);
  font-family:var(--serif);font-size:15px;letter-spacing:.42em;padding:15px 40px 15px 46px;border-radius:2px;
  transition:transform .15s;}
#gateEnter:active{transform:scale(.96);background:rgba(217,180,91,.08);}
.gNote{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  font-size:10.5px;letter-spacing:.2em;color:rgba(237,227,203,.4);}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================================================================
   LE SALON PRIVÉ · roulette européenne 3D
   ================================================================ */
'use strict';
var __errs=[];
function showErr(m){ __errs.push(m); try{console.error('[salon]',m);}catch(_){} }
window.addEventListener('error',function(ev){ showErr((ev.message||'erreur')+' \u00b7 ligne '+(ev.lineno||'?')); });
window.addEventListener('unhandledrejection',function(ev){ showErr('Promesse: '+((ev.reason&&ev.reason.message)||ev.reason)); });
if(typeof THREE==='undefined'){
  try{
    var gs=document.getElementById('gateStats');
    if(gs) gs.textContent="Connexion requise pour l'aper\u00e7u \u00b7 la version install\u00e9e joue hors ligne";
    var ge=document.getElementById('gateEnter');
    if(ge) ge.style.display='none';
  }catch(_){}
  throw new Error('THREE manquant');
}
const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);
const easeOutCubic=t=>1-Math.pow(1-t,3);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const fmt=(t,m)=>t.replace(/\{(\w+)\}/g,(_,k)=>m[k]!==undefined?m[k]:'');
const eur=n=>Math.round(n).toLocaleString('fr-FR')+' €';

const ORDER=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const STEP=TAU/37;
const RED=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
const FRNUM=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf','vingt','vingt-et-un','vingt-deux','vingt-trois','vingt-quatre','vingt-cinq','vingt-six','vingt-sept','vingt-huit','vingt-neuf','trente','trente-et-un','trente-deux','trente-trois','trente-quatre','trente-cinq','trente-six'];

/* ---------------- state ---------------- */
let bank=1000, displayBank=1000, best=0, rounds=0;
let counts=new Array(37).fill(0), spins=0;
let phase='gate';            // gate | betting | closing | spinning | result
let selChip=25;
let playerBets=[], botBets=[], lastBets=[];
let historyNums=[];
let bettingTimer=null, bettingEndsAt=0;
let botTimeouts=[];
let entered=false;

async function loadState(){
  try{
    let raw=null;
    if(window.storage){ const r=await window.storage.get('salon-prive'); raw=r&&r.value; }
    else { try{ raw=localStorage.getItem('salon-prive'); }catch(e){} }
    if(raw){const d=JSON.parse(raw);
      if(typeof d.bank==='number') bank=d.bank;
      if(typeof d.best==='number') best=d.best;
      if(typeof d.rounds==='number') rounds=d.rounds;
      if(Array.isArray(d.counts)&&d.counts.length===37) counts=d.counts;
      if(typeof d.spins==='number') spins=d.spins;
      displayBank=bank;
    }
  }catch(e){}
}
async function saveState(){
  const raw=JSON.stringify({bank,best,rounds,counts,spins});
  try{
    if(window.storage) await window.storage.set('salon-prive', raw);
    else { try{ localStorage.setItem('salon-prive', raw); }catch(e){} }
  }catch(e){}
}

/* ================================================================
   AUDIO
   ================================================================ */
const A={
  ctx:null, master:null, musicBus:null, musicOn:true, voiceOn:true,
  frVoice:null, beat:0, nextBeat:0, schedTimer:null, rollNodes:null, noiseBuf:null,
  init(){
    if(this.ctx) return;
    const C=window.AudioContext||window.webkitAudioContext;
    this.ctx=new C();
    const comp=this.ctx.createDynamicsCompressor();
    comp.threshold.value=-18; comp.ratio.value=4;
    comp.connect(this.ctx.destination);
    this.master=this.ctx.createGain(); this.master.gain.value=.9;
    this.master.connect(comp);
    this.musicBus=this.ctx.createGain(); this.musicBus.gain.value=0;
    this.musicBus.connect(this.master);
    // delay lounge sur bus musique
    this.delay=this.ctx.createDelay(1); this.delay.delayTime.value=.34;
    this.dFb=this.ctx.createGain(); this.dFb.gain.value=.3;
    this.dWet=this.ctx.createGain(); this.dWet.gain.value=.22;
    this.delay.connect(this.dFb); this.dFb.connect(this.delay);
    this.delay.connect(this.dWet); this.dWet.connect(this.musicBus);
    this.noiseBuf=this.makeNoise(2);
    this.crowdStart();
    if(this.musicOn) this.musicStart();
    const loadV=()=>{try{
      const vs=speechSynthesis.getVoices();
      this.frVoice=vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith('fr'))||null;
    }catch(e){}};
    try{ loadV(); speechSynthesis.onvoiceschanged=loadV; }catch(e){}
  },
  makeNoise(sec){
    const n=this.ctx.sampleRate*sec, b=this.ctx.createBuffer(1,n,this.ctx.sampleRate), d=b.getChannelData(0);
    let last=0;
    for(let i=0;i<n;i++){ last=(last+(Math.random()*2-1)*.5)*.97; d[i]=last*1.4; }
    return b;
  },
  out(pan){
    if(pan&&this.ctx.createStereoPanner){
      const p=this.ctx.createStereoPanner(); p.pan.value=clamp(pan,-1,1);
      p.connect(this.master); return p;
    }
    return this.master;
  },
  blip(f,dur,type,g,when,fEnd,pan){
    if(!this.ctx)return; const t=when||this.ctx.currentTime;
    const o=this.ctx.createOscillator(), gn=this.ctx.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(fEnd) o.frequency.exponentialRampToValueAtTime(Math.max(20,fEnd),t+dur);
    gn.gain.setValueAtTime(g,t); gn.gain.exponentialRampToValueAtTime(.0005,t+dur);

function bandTexture(){
  const W=2048,H=150,c=cvs(W,H),g=c.getContext('2d');
  g.fillStyle='#141210'; g.fillRect(0,0,W,H);
  const cw=W/37;
  const uOf=a=>((((a+Math.PI/2)/TAU)%1)+1)%1;
  for(let i=0;i<37;i++){
    const n=ORDER[i], cx=uOf(i*STEP)*W;
    const col=n===0?'#0f7a4c':(RED.has(n)?'#ae2532':'#191614');
    [-W,0,W].forEach(o=>{ g.fillStyle=col; g.fillRect(cx+o-cw/2,0,cw,H); });
  }
  g.fillStyle='#c9a959';
  for(let i=0;i<37;i++){
    const cx=uOf(i*STEP+STEP/2)*W;
    [-W,0,W].forEach(o=>g.fillRect(cx+o-1.1,0,2.2,H));
  }
  g.fillRect(0,0,W,5); g.fillRect(0,H-5,W,5);
  g.font='800 50px "Bodoni 72", Didot, Georgia, serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.lineWidth=6; g.strokeStyle='rgba(0,0,0,.55)'; g.fillStyle='#f6efdc';
  for(let i=0;i<37;i++){
    const cx=uOf(i*STEP)*W;
    [-W,0,W].forEach(o=>{ g.save(); g.translate(cx+o,H/2); g.rotate(Math.PI);
      g.strokeText(String(ORDER[i]),0,3); g.fillText(String(ORDER[i]),0,3); g.restore(); });
  }
  const t=tex(c); t.wrapS=THREE.RepeatWrapping;

  return t;
}

/* cases imprimées sur le tapis → coordonnées monde */
const LAY={gx0:-2.76,colW:.46,zTop:1.77,zMid:2.19,zBot:2.61,dz:3.01,cz:3.42};
const numAt=(c,rw)=>c*3+(rw===0?3:(rw===1?2:1));
const colNums=c=>[c*3+1,c*3+2,c*3+3];
const gid=nums=>'g:'+[...nums].sort((a,b)=>a-b).join(',');
const gNums=id=>id.slice(2).split(',').map(Number);
function groupAnchor(nums){
  const L=nums.length;
  if(nums[0]===0){
    if(L===2){const o=nums[1];return {x:-2.76,z:o===1?2.61:(o===2?2.19:1.77)};}
    if(L===3) return {x:-2.76,z:nums.indexOf(3)>=0?1.98:2.4};
    return {x:-2.76,z:2.82};
  }
  const cc=n=>cellWorldPos('n'+n);
  if(L===2){const a=cc(nums[0]),b=cc(nums[1]);return {x:(a.x+b.x)/2,z:(a.z+b.z)/2};}
  if(L===3){const c=Math.floor((nums[0]-1)/3);return {x:-2.76+(c+.5)*.46,z:2.82};}
  if(L===4){let sx=0,sz=0;nums.forEach(n=>{const p=cc(n);sx+=p.x;sz+=p.z;});return {x:sx/4,z:sz/4};}
  return {x:-2.76+Math.floor((nums[3]-1)/3)*.46,z:2.82};
}
function cellWorldPos(id){
  if(id[0]==='g') return groupAnchor(gNums(id));
  if(id==='col1') return {x:3.04,z:2.61};
  if(id==='col2') return {x:3.04,z:2.19};
  if(id==='col3') return {x:3.04,z:1.77};
  if(id[0]==='n'){
    const n=+id.slice(1);
    if(n===0) return {x:-3.04,z:LAY.zMid};
    const c=Math.floor((n-1)/3);
    const z=n%3===0?LAY.zTop:(n%3===2?LAY.zMid:LAY.zBot);
    return {x:LAY.gx0+(c+.5)*LAY.colW, z};
  }
  if(id==='d1') return {x:-1.84,z:LAY.dz};
  if(id==='d2') return {x:0,z:LAY.dz};
  if(id==='d3') return {x:1.84,z:LAY.dz};
  const xs={low:-2.3,even:-1.38,red:-.46,black:.46,odd:1.38,high:2.3};
  return {x:xs[id]||0,z:LAY.cz};
}
let cellStacks={};
function stackPos(id){
  let s=cellStacks[id];
  if(!s) s=cellStacks[id]={n:0,jx:rand(-.05,.05),jz:rand(-.04,.04)};
  const p=cellWorldPos(id);
  const v=new THREE.Vector3(p.x+s.jx+rand(-.009,.009), .017+s.n*.031, p.z+s.jz+rand(-.009,.009));
  s.n++; return v;
}
function unstack(id){ const s=cellStacks[id]; if(s&&s.n>0) s.n--; }

/* ================================================================
   SPIN · trajectoire déterministe
   ================================================================ */
const T1=4.6,T2=7.0,T3=8.6;
const vA0=8.6,vA1=4.2,vB1=1.8;
const kA=(vA0-vA1)/T1, kB=(vA1-vB1)/(T2-T1);
const distA=t=>vA0*t-.5*kA*t*t;
const distAB=tb=>distA(T1)+vA1*tb-.5*kB*tb*tb;
let spin=null;

function startSpin(){
  const n=Math.floor(Math.random()*37);
  const aWin=ORDER.indexOf(n)*STEP;
  if(ball.parent!==ballPivot){ ball.parent.remove(ball); ballPivot.add(ball); }
  hlRing.visible=false;
  const th0=Math.random()*TAU;
  ballPivot.rotation.y=th0;
  ball.position.set(R_TRACK,.55,0); ball.visible=true;
  const ticks=[]; let acc=T1+.15;
  [.26,.36,.48,.64,.85].forEach(g=>{ acc+=g*rand(.85,1.15); if(acc<T2-.12) ticks.push(acc); });
  spin={n,aWin,th0,t:0,ticks,ti:0,lastTick:-9,cap:null,prevSin:0,announced:false,done:false};
  rotorTarget=.8;
  A.whoosh(); A.rollStart(T1,T2,T3);
}

function updateSpin(dt){
  if(!spin||spin.done) return;
  spin.t+=dt; const t=spin.t;
  if(!spin.announced&&t>3.2){
    spin.announced=true; A.speak('Rien ne va plus.'); A.chime();
    setPhaseLbl('Rien ne va plus',true);
  }
  let theta,r,y;
  if(t<T1){ theta=spin.th0-distA(t); r=R_TRACK; y=.55; }
  else if(t<T2){
    const tb=t-T1, s=tb/(T2-T1);
    theta=spin.th0-distAB(tb);
    r=lerp(R_TRACK,1.4,smooth(s)); y=lerp(.55,.4,s);
    while(spin.ti<spin.ticks.length&&t>spin.ticks[spin.ti]){
      A.tick(Math.max(.1,.5-spin.ti*.07)); spin.lastTick=spin.ticks[spin.ti]; spin.ti++;
    }
    y+=.045*Math.exp(-(t-spin.lastTick)*16);
  }
  else if(t<T3){
    if(!spin.cap){
      const rho=rotor.rotation.y;
      const thNow=spin.th0-distAB(T2-T1);
      const d0=thNow-rho;
      const d=((d0-spin.aWin)%TAU+TAU)%TAU;
      const dr=d+(d<Math.PI?TAU:0);
      spin.cap={d0,dT:d0-dr,m0:-(vB1+rotorSpeed)*(T3-T2)};
    }
    const s=(t-T2)/(T3-T2);
    const h00=2*s*s*s-3*s*s+1, h10=s*s*s-2*s*s+s, h01=-2*s*s*s+3*s*s;
    const delta=h00*spin.cap.d0+h10*spin.cap.m0+h01*spin.cap.dT;
    theta=rotor.rotation.y+delta;
    r=lerp(1.4,1.13,easeOutCubic(s));
    const yb=lerp(.4,.145,easeOutCubic(s));
    const sn=Math.sin(s*Math.PI*3.2);
    y=yb+.1*Math.exp(-4.5*s)*Math.abs(sn);
    if((spin.prevSin>0&&sn<=0)||(spin.prevSin<0&&sn>=0)) A.bounce(Math.max(.08,.3*(1-s)));
    spin.prevSin=sn;
  }
  else{
    spin.done=true;
    ballPivot.remove(ball); rotor.add(ball);
    ball.position.copy(polar(spin.aWin,1.13,.145));
    hlRing.position.copy(polar(spin.aWin,1.13,.3)); hlRing.visible=true;
    rotorTarget=.15; camMode='close'; A.thud();
    const n=spin.n;
    setTimeout(()=>settle(n),900);
    return;
  }
  ballPivot.rotation.y=theta;
  ball.position.set(r,y,0);
}

  const nets=BOTS.map(b=>{

    botBets.filter(x=>x.bot===b).forEach(x=>{stake+=x.amt;ret+=payout(x.id,x.amt,n);});
    return {b,net:ret-stake,stake};
  }).filter(x=>x.stake>0);
  const winners=nets.filter(x=>x.net>0).sort((a,b)=>b.net-a.net);
  const losers=nets.filter(x=>x.net<0);

const EVEN_IDS=new Set(['red','black','even','odd','low','high']);
function payout(id,amt,n){
  if(id[0]==='g'){const ns=gNums(id);return ns.indexOf(n)>=0?amt*(36/ns.length):0;}
  if(id==='col1') return (n!==0&&n%3===1)?amt*3:0;
  if(id==='col2') return (n!==0&&n%3===2)?amt*3:0;
  if(id==='col3') return (n!==0&&n%3===0)?amt*3:0;
  if(id[0]==='n') return (+id.slice(1)===n)?amt*36:0;
  if(id==='d1') return (n>=1&&n<=12)?amt*3:0;
  if(id==='d2') return (n>=13&&n<=24)?amt*3:0;
  if(id==='d3') return (n>=25&&n<=36)?amt*3:0;
  if(n===0&&EVEN_IDS.has(id)) return Math.floor(amt/2); // règle du partage
  if(id==='red') return RED.has(n)?amt*2:0;
  if(id==='black') return (n!==0&&!RED.has(n))?amt*2:0;
  if(id==='even') return (n!==0&&n%2===0)?amt*2:0;
  if(id==='odd') return (n%2===1)?amt*2:0;
  if(id==='low') return (n>=1&&n<=18)?amt*2:0;
  if(id==='high') return (n>=19&&n<=36)?amt*2:0;
  return 0;
}

const EPS=.1;
function betAt(x,z){
  if(x<-3.32||x>3.32||z<1.56||z>3.64) return null;
  const colOf=v=>clamp(Math.floor((v+2.76)/.46),0,11);
  const rowOf=v=>clamp(Math.floor((v-1.56)/.42),0,2);
  if(z>=2.82-EPS&&z<=2.82+EPS&&x>=-2.76-EPS&&x<=2.76+EPS){
    const kv=Math.round((x+2.76)/.46);
    const dv=Math.abs(x-(-2.76+kv*.46));
    if(dv<EPS){
      if(kv===0) return gid([0,1,2,3]);
      if(kv>=1&&kv<=11) return gid(colNums(kv-1).concat(colNums(kv)));
    }
    return gid(colNums(colOf(x)));
  }
  if(x>=-2.76-EPS&&x<=-2.76+EPS&&z>=1.56&&z<2.82-EPS){
    const jh=Math.round((z-1.56)/.42);
    if(Math.abs(z-(1.56+jh*.42))<EPS&&(jh===1||jh===2))
      return gid(jh===1?[0,2,3]:[0,1,2]);
    const rw=rowOf(z);
    return gid([0,rw===0?3:(rw===1?2:1)]);
  }
  if(x>-2.76+EPS&&x<=2.76+EPS&&z>=1.56&&z<2.82-EPS){
    const xc=Math.min(x,2.76);
    const kv=Math.round((xc+2.76)/.46), jh=Math.round((z-1.56)/.42);
    const dv=Math.abs(xc-(-2.76+kv*.46)), dh=Math.abs(z-(1.56+jh*.42));
    const vOn=dv<EPS&&kv>=1&&kv<=11, hOn=dh<EPS&&(jh===1||jh===2);
    if(vOn&&hOn) return gid([numAt(kv-1,jh-1),numAt(kv-1,jh),numAt(kv,jh-1),numAt(kv,jh)]);
    if(vOn){const rw=rowOf(z);return gid([numAt(kv-1,rw),numAt(kv,rw)]);}
    if(hOn){const c=colOf(xc);return gid([numAt(c,jh-1),numAt(c,jh)]);}
    return 'n'+numAt(colOf(xc),rowOf(z));
  }
  if(x>=-3.32&&x<=-2.76-EPS&&z>=1.56&&z<2.82-EPS) return 'n0';
  if(x>2.76+EPS&&x<=3.32&&z>=1.56&&z<=2.82){
    const rw=rowOf(z); return rw===0?'col3':(rw===1?'col2':'col1');
  }
  if(z>2.82+EPS&&z<=3.2&&x>=-2.76&&x<=2.76) return x<-.92?'d1':(x<.92?'d2':'d3');
  if(z>3.2&&z<=3.64&&x>=-2.76&&x<=2.76){
    const k=Math.min(5,Math.floor((x+2.76)/.92));
    return ['low','even','red','black','odd','high'][k];
  }
  return null;
}
function pickPoint(e){
  const r=renderer.domElement.getBoundingClientRect();
  const oy=(e.pointerType==='touch')?-46:0;
  const nx=((e.clientX-r.left)/r.width)*2-1;
  const ny=-((e.clientY+oy-r.top)/r.height)*2+1;
  raycaster.setFromCamera({x:nx,y:ny},camera);
  const d=raycaster.ray.direction, o=raycaster.ray.origin;
  if(Math.abs(d.y)<1e-6) return null;
  const t=(0-o.y)/d.y;
  if(t<=0) return null;
  const x=o.x+d.x*t, z=o.z+d.z*t;
  return {x,z,cell:betAt(x,z)};
}
function ghostMatFor(v){
  if(!ghostMatsCache[v])
    ghostMatsCache[v]=chipMat(v).map(m=>{const c=m.clone();c.transparent=true;c.opacity=.85;return c;});
  return ghostMatsCache[v];
}
function ghostShow(v){
  if(v){
    if(ghostChip) ghost.remove(ghostChip);

}
function updateDrag(p){
  ghostTarget.set(clamp(p.x,-5.2,5.2),.38,clamp(p.z,-3.9,3.9));
  if(p.cell!==drag.cell){
    drag.cell=p.cell;
    if(p.cell){
      glowShowFor(p.cell);
      const info=tagInfoFor(p.cell);
      tagShow(info.name+' \u00b7 '+selChip+' \u20ac', info.pay);
      A.blip(1400,.025,'triangle',.05);
    } else {
      glowHide();

    }
  }
}
function onDown(e){
  if(!entered) return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    if(drag){ drag=null; ghostShow(false); glowHide(); tagFade(0); }
    const pts=[...pointers.values()];
    pinch={d0:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)||1,
      zoom0:betZoom, mx0:(pts[0].x+pts[1].x)/2, my0:(pts[0].y+pts[1].y)/2,
      px0:betPan.x, pz0:betPan.z};
    e.preventDefault();
    return;
  }
  if(pinch||pointers.size>1) return;
  if(phase!=='betting'||drag) return;
  const p=pickPoint(e);
  if(!p) return;
  e.preventDefault();
  drag={cell:undefined};
  ghostTarget.set(clamp(p.x,-5.2,5.2),.38,clamp(p.z,-3.9,3.9));
  updateDrag(p);
  ghostShow(true);
  A.pick();
  try{ renderer.domElement.setPointerCapture(e.pointerId); }catch(_){}
}
function onMove(e){
  const pt=pointers.get(e.pointerId);
  if(pt){ pt.x=e.clientX; pt.y=e.clientY; }
  if(pinch&&pointers.size>=2){
    e.preventDefault();
    const pts=[...pointers.values()];
    const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)||1;
    betZoom=clamp(pinch.zoom0*d/pinch.d0,1,2.4);
    const mx=(pts[0].x+pts[1].x)/2, my=(pts[0].y+pts[1].y)/2;
    const k=.0085/betZoom;
    betPan.x=clamp(pinch.px0-(mx-pinch.mx0)*k,-2.8,2.8);
    betPan.z=clamp(pinch.pz0-(my-pinch.my0)*k,-1.7,1.25);
    if(betZoom<1.03){ betZoom=1; betPan.x=0; betPan.z=0; }
    return;
  }
  if(!drag) return;
  e.preventDefault();
  const p=pickPoint(e);
  if(p) updateDrag(p);
}
function onUp(e){
  if(e&&e.pointerId!==undefined) pointers.delete(e.pointerId);
  if(pointers.size<2) pinch=null;
  if(!drag) return;
  const cell=drag.cell;
  const gpos=ghost.position.clone();
  drag=null; ghostShow(false); glowHide();
  if(phase!=='betting'||!cell){ tagFade(150); return; }
  if(bank<selChip){ A.denied(); $('caisseBtn').classList.add('show'); tagFade(300); return; }
  bank-=selChip; placedOnce=true;
  const to=stackPos(cell);
  const m=addChipMesh(selChip,gpos);
  playerBets.push({id:cell,amt:selChip,mesh:m});
  flights.push({m,from:gpos.clone(),to,t:0,dur:.16,arc:.05,spin:false,land:true,
    pan:clamp(to.x/5,-1,1)*.6});
  const info=tagInfoFor(cell);
  tagShow('+ '+selChip+' \u20ac \u00b7 '+info.name, info.pay);
  tagFade(1200);
  updateMise();
}

const fx=$('fx'), fg=fx.getContext('2d');
let parts=[], fxOn=false;
function sizeFx(){ fx.width=innerWidth; fx.height=innerHeight; }
function confetti(count){
  const cols=['#d9b45b','#f0d78c','#a3242e','#1c1a1a','#ffffff'];
  for(let i=0;i<count;i++){
    parts.push({x:rand(0,innerWidth),y:rand(-140,-10),vx:rand(-1.4,1.4),vy:rand(2,5),
      g:.12,rot:rand(0,TAU),vr:rand(-.2,.2),s:rand(4,9),col:pick(cols),
      circ:Math.random()<.4,life:rand(120,180)});
  }
  if(!fxOn){fxOn=true;fxLoop();}
}
function fxLoop(){
  fg.clearRect(0,0,fx.width,fx.height);
  parts=parts.filter(p=>p.life>0&&p.y<fx.height+20);
  parts.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.g*.4; p.rot+=p.vr; p.life--;
    fg.save(); fg.translate(p.x,p.y); fg.rotate(p.rot);
    fg.globalAlpha=clamp(p.life/40,0,1); fg.fillStyle=p.col;
    if(p.circ){fg.beginPath();fg.arc(0,0,p.s*.5,0,TAU);fg.fill();}
    else fg.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
    fg.restore();
  });
  if(parts.length) requestAnimationFrame(fxLoop); else fxOn=false;
}

/* ================================================================
   RENDU
   ================================================================ */
let lastT=0, swayT=0, shake=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(ts-lastT)/1000||.016); lastT=ts; swayT+=dt;

  rotorSpeed+=(rotorTarget-rotorSpeed)*(1-Math.exp(-dt*1.4));
  rotor.rotation.y+=rotorSpeed*dt;
  updateSpin(dt);

  // vols de jetons
  flights.forEach(f=>{
    f.t+=dt; const s=clamp(f.t/f.dur,0,1);
    f.m.position.lerpVectors(f.from,f.to,s);
    f.m.position.y+=Math.sin(s*Math.PI)*(f.arc||.55);
    if(f.spin) f.m.rotation.y+=dt*9;
    if(s>=1&&!f.done){ f.done=true; f.m.position.copy(f.to); if(f.land) A.tock(f.pan); }
  });
  flights=flights.filter(f=>!f.done);

  // poussière
  const dp=dust.geometry.attributes.position;
  for(let i=0;i<dp.count;i++){
    let y=dp.getY(i)-dt*.09;
    if(y<.3) y=5;
    dp.setY(i,y);
  }
  dp.needsUpdate=true;

  // fumée
  smokes.forEach(s=>{
    const c=((swayT*.11)+s.off)%1;
    s.sp.position.y=.1+c*1.05;
    s.sp.position.x=-3.73+Math.sin(swayT*1.3+s.off*9)*.06*c;
    const sc=.15+c*.55; s.sp.scale.set(sc,sc,1);
    s.sp.material.opacity=.14*Math.sin(c*Math.PI);
  });
  bokehs.forEach(b=>{ b.sp.position.y=b.y+Math.sin(swayT*.4+b.ph)*.18; });

  if(ghost.visible) ghost.position.lerp(ghostTarget,1-Math.exp(-dt*18));
  glowMat.opacity=.32+.3*(0.5+0.5*Math.sin(swayT*6));
  $('zoomReset').classList.toggle('show', camMode==='bet'&&betZoom>1.05);

  if(hlRing.visible){
    const p=.5+.5*Math.sin(swayT*7);
    hlRing.scale.setScalar(1+p*.35);
    hlRing.material.opacity=.45+.5*p;
  }

  // caméra
  let tp,tl;
  if(camMode==='spin'){ tp=tmpV.set(0,4.15,.55); tl=new THREE.Vector3(0,.3,WHEEL_Z); }
  else if(camMode==='close'){
    tp=tmpV.set(0,2.65,.75);
    tl=new THREE.Vector3(); ball.getWorldPosition(tl);
  }
  else if(camMode==='bet'){
    const inv=1/betZoom;
    const lx=betPan.x, lz=2.3+betPan.z;
    tp=tmpV.set(lx+Math.sin(swayT*.25)*.16*inv,
      4.95*inv+Math.sin(swayT*.4)*.05*inv, lz+2.65*inv);
    tl=new THREE.Vector3(lx+Math.sin(swayT*.2)*.06*inv,0,lz);
  }
  else{
    tp=tmpV.set(Math.sin(swayT*.25)*.22, 5.75+Math.sin(swayT*.4)*.08, 6.3);
    tl=new THREE.Vector3(Math.sin(swayT*.2)*.1,.2,.35);
  }
  camPos.lerp(tp,1-Math.exp(-dt*2.6));
  camLook.lerp(tl,1-Math.exp(-dt*2.6));
  camera.position.copy(camPos);
  if(shake>.002){
    camera.position.x+=rand(-1,1)*.05*shake;
    camera.position.y+=rand(-1,1)*.04*shake;
    shake*=Math.exp(-dt*3.2);
  }
  camera.lookAt(camLook);

  // solde animé
  displayBank+=(bank-displayBank)*(1-Math.exp(-dt*7));
  if(Math.abs(displayBank-bank)<.6) displayBank=bank;
  $('bankVal').textContent=eur(displayBank);

  renderer.render(scene,camera);
}

  const hot=idx.filter(n=>counts[n]>0).sort((a,c)=>counts[c]-counts[a]||a-c).slice(0,5);
  const cold=idx.slice().sort((a,c)=>counts[a]-counts[c]||a-c).slice(0,5);
  const sum=f=>idx.filter(f).reduce((s,n)=>s+counts[n],0);

    } else {
      A.ctx.resume();
      if(A._keep){ const p=A._keep.play(); if(p&&p.catch) p.catch(()=>{}); }
    }
  });
  window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.fov=camera.aspect<0.8?62:50;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
    sizeFx();
  });
}

/* ---------- grain ---------- */
function makeGrain(){
  const c=cvs(96,96),g=c.getContext('2d');
  const im=g.createImageData(96,96);
  for(let i=0;i<im.data.length;i+=4){
    const v=Math.floor(Math.random()*255);
    im.data[i]=v;im.data[i+1]=v;im.data[i+2]=v;im.data[i+3]=28;
  }
  g.putImageData(im,0,0);
  const el=$('grain');
  el.style.backgroundImage='url('+c.toDataURL()+')';
  let flip=false;
  setInterval(()=>{ flip=!flip; el.style.backgroundPosition=flip?'13px 7px':'0 0'; },130);
}

/* ---------- boot ---------- */
(async function(){
  try{ buildScene(); }catch(e){ showErr('Init 3D: '+e.message); return; }
  wire(); sizeFx(); makeGrain();
  camera.aspect=innerWidth/innerHeight;
  camera.fov=camera.aspect<0.8?62:50;
  camera.updateProjectionMatrix();
  setPhaseLbl('',false);
  await loadState();
  displayBank=bank;
  $('bankVal').textContent=eur(bank);
  $('gateStats').textContent=rounds>0
    ? 'Solde '+eur(bank)+' · Record + '+eur(best)+' · '+rounds+' tours'
    : 'Nouvelle table · 1 000 € offerts';
  requestAnimationFrame(loop);
})();
</script>
